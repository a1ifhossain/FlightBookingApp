services:
  - type: web
    name: flightbooking-supplier
    runtime: docker
    plan: free
    dockerfilePath: src/FlightBooking.MockSupplier/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
  - type: web
    name: flightbooking-api
    runtime: docker
    plan: free
    dockerfilePath: src/FlightBooking.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__SqlServer
        sync: false
      - key: Supplier__Url
        sync: false
      - key: Frontend__Origins
        sync: false
      - key: Seed__Password
        sync: false
      - key: Supplier__TimeoutSeconds
        value: "90"
      - key: Database__Initialize
        value: "true"
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
