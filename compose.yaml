name: flightbooking
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/setup.ps1 first}
    ports: ["127.0.0.1:14333:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  supplier:
    build:
      context: .
      dockerfile: src/FlightBooking.MockSupplier/Dockerfile
    ports: ["127.0.0.1:5090:8080"]
  api:
    build:
      context: .
      dockerfile: src/FlightBooking.Api/Dockerfile
    environment:
      ConnectionStrings__SqlServer: "Server=sql;Database=FlightBooking;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Supplier__Url: http://supplier:8080
      Database__Initialize: "true"
      Seed__Password: ${DEMO_PASSWORD:?Run scripts/setup.ps1 first}
      DataProtection__Path: /app/keys
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    ports: ["127.0.0.1:5080:8080"]
    volumes: ["api-keys:/app/keys"]
    depends_on:
      sql: {condition: service_healthy}
      supplier: {condition: service_started}
  web:
    build:
      context: .
      dockerfile: src/flight-booking-web/Dockerfile
    ports: ["127.0.0.1:8088:80"]
    depends_on: [api]
volumes:
  sql-data:
  api-keys:
